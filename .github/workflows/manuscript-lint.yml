name: manuscript-lint

on:
  push:
    paths: ['**.tex', '**.md', 'scripts/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run manuscript compliance checker on templates
        run: |
          python3 scripts/manuscript_check.py templates/latex/manuscript/main.tex --style acs || true
          python3 scripts/text_stats.py templates/latex/manuscript/main.tex
      - name: Validate data files
        run: |
          python3 - <<'EOF'
          import csv, json
          with open('data/iiserb-bhopal-chemistry-journals.csv') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) > 200, "journal dataset too small"
          with open('data/iiserb-bhopal-scholars.csv') as f:
              rows2 = list(csv.DictReader(f))
          assert len(rows2) >= 100, "scholar dataset too small"
          json.load(open('data/publications-sample.json'))
          print("data validation OK:", len(rows), "journals,", len(rows2), "scholars")
          EOF
