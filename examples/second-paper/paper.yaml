abstract:
  context: Cyclometalated iridium(III) complexes combine high phosphorescence quantum yields with tunable
    excited-state lifetimes, which makes them attractive for imaging and photodynamic therapy.
  gap: Substituent effects on the pyrazolate ancillary ligand are rarely separated from those of the cyclometalating
    ligands, so the design rules remain empirical.
  approach: We prepared six heteroleptic complexes [Ir(ppy)2(R-pz)] with R = H, Me, Cl, OMe, thienyl and
    CF3, and measured their photophysics and cytotoxicity side by side.
  results: Emission maxima span 588–648 nm, quantum yields 0.22–0.81 and lifetimes 0.51–1.88 μs; IC50
    values against HepG2 cells range from 4.1 to 25.3 μM with selectivity indices up to 3.2.
  impact: Electron-donating substituents raise quantum yield and lower cytotoxicity, which enables a simple
    lever for separating imaging from therapeutic behaviour.
sections:
- heading: Introduction
  paragraphs:
  - text: Iridium(III) cyclometalated complexes are workhorse phosphors because heavy-atom-induced spin–orbit
      coupling mixes singlet and triplet states and makes triplet emission fast and efficient [ic4013872].
      Their photophysics is routinely tuned by decorating the cyclometalating ligands [d2qi02058k], while
      the ancillary ligand is usually treated as a spectator [ic061513v].
    cites:
    - ic4013872
    - d2qi02058k
    - ic061513v
  - text: 'Pyrazolate ancillaries are attractive because they are isoelectronic with acetylacetonate but
      far more modular: a single substituent can be varied across steric and electronic series without
      touching the metal [inorgchem5b02872]. Systematic comparisons are, however, rare, and cytotoxicity
      is almost never measured on the same series [cmdc201400040].'
    cites:
    - inorgchem5b02872
    - cmdc201400040
  - text: Here we report six [Ir(ppy)2(R-pz)] complexes that differ only at the pyrazolate 3-position,
      and use them to test whether one substituent can control emission energy, quantum yield and biological
      activity simultaneously [c2dt30771e].
    cites:
    - c2dt30771e
- heading: Results and discussion
  paragraphs:
  - text: All six complexes were isolated in 63–92% yield after chromatography and were fully characterised
      by ¹H/¹³C NMR, HRMS and IR; the data are consistent with a single heteroleptic product in each case
      [om100714g]. The ligands themselves come from a one-step condensation (Scheme 1).
    cites:
    - om100714g
  - __SUB__: Photophysics
  - text: Absorption spectra are dominated by ligand-centred transitions below 300 nm and by metal-to-ligand
      charge transfer between 350 and 420 nm (Figure 1). Emission moves from 648 nm for the chloro complex
      to 588 nm for the trifluoromethyl complex, a 60 nm window that tracks the electron-withdrawing strength
      of the substituent.
    cites: []
  - __SUB__: Cytotoxicity
  - text: 'IC50 values against HepG2 cells follow the opposite trend to quantum yield: the strongly donating
      methoxy complex is the least cytotoxic (25.3 μM, Φ = 0.81) and the trifluoromethyl complex the most
      cytotoxic (4.1 μM, Φ = 0.22) (Figure 2, Table 2). Selectivity indices against HEK293 cells remain
      near 3.2 across the series, so the substituent shifts potency rather than selectivity [znb2012].'
    cites:
    - znb2012
- heading: Conclusion
  paragraphs:
  - text: A single pyrazolate substituent moves emission across 60 nm and quantum yield across a factor
      of four, and the same axis controls cytotoxicity. The inverse correlation between Φ and potency
      suggests that excited-state lifetime, not brightness alone, governs the biological response; time-resolved
      cellular studies are the obvious next step.
    cites: []
