name: Research sync

# Scheduled, read-only synchronisation of public metadata into a throw-away store.
# It asserts that the pipeline still works against the live APIs; it never commits
# data back to the repository and needs no secrets beyond an optional OpenAlex key.

on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      query:
        description: "Query to synchronise"
        required: false
        default: "photoredox catalysis"
      limit:
        description: "Records per provider"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PF_MAILTO: ${{ vars.PF_MAILTO || 'noreply@example.org' }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Provider readiness
        run: python -m paperforge research providers

      - name: Synchronise
        id: sync
        continue-on-error: true       # a partial run is informative, not a build failure
        run: |
          python -m paperforge research sync "${{ github.event.inputs.query || 'photoredox catalysis' }}" \
            --db research.sqlite3 \
            --limit "${{ github.event.inputs.limit || '10' }}" \
            --json > sync.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Coverage report
        if: always()
        run: |
          python -m paperforge research coverage --db research.sqlite3 --json > coverage.json || true

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Research sync"
            echo '```'
            cat sync.json 2>/dev/null | head -60 || echo "(no sync report)"
            echo '```'
            echo "### Coverage"
            echo '```json'
            cat coverage.json 2>/dev/null | head -60 || echo "(no coverage report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-sync-${{ github.run_id }}
          path: |
            sync.json
            coverage.json
          retention-days: 30
