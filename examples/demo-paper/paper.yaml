abstract:
  context: Visible-light photoredox catalysis has become a general strategy for forming C–C bonds under mild conditions.
  gap: Direct C3–H arylation of quinoxalin-2(1H)-ones with aryl diazonium salts remains limited by competing N-arylation
    and a narrow substrate scope.
  results:
  - Using 4CzIPN (2 mol%) and blue LEDs in ethanol, eight aryl groups were installed in 61–94% isolated yield.
  - Chloro, nitro, trifluoromethyl and heteroaryl substituents were tolerated, and Stern–Volmer analysis (KSV =
    0.091 mM−1) supports reductive quenching of the excited photocatalyst.
  impact: The method provides a mild, operationally simple route to 3-arylquinoxalin-2(1H)-ones and should extend
    to other electron-poor heteroarenes.
sections:
- heading: Introduction
  paragraphs:
  - text: Visible-light photoredox catalysis converts photon energy into single-electron chemistry under conditions
      that are often inaccessible thermally. Organic photoredox catalysts in particular avoid transition-metal residues
      and enable strong reducing or oxidising regimes with simple LED sources [romero2016organic]. Transition-metal
      polypyridyl complexes laid much of the mechanistic groundwork for these reactions [prier2013visible], and
      the strategy now spans radical additions, cross-couplings and C–H functionalisations [narayanam2011visible,
      xuan2012visible].
    cites:
    - romero2016organic
    - prier2013visible
    - narayanam2011visible
    - xuan2012visible
  - text: Quinoxalin-2(1H)-ones are privileged scaffolds in medicinal chemistry, yet selective functionalisation
      of the C3 position remains challenging because the N–H and C3–H sites compete for the same electrophiles.
      Recent reviews catalogue visible-light C(3)–H functionalisation of these heterocycles [xin2026recent, yang2023recent],
      and a base-mediated arylation in ethanol has been reported [pan2024base]; however, the scope is dominated
      by activated aryl partners and the mechanism is rarely probed.
    cites:
    - xin2026recent
    - yang2023recent
    - pan2024base
  - text: We reasoned that an aryl diazonium salt could serve as both the aryl-radical source and the oxidant, allowing
      a photocatalyst to operate in a reductive-quenching regime. Here we report a mild C3–H arylation that tolerates
      electron-poor arenes and heteroarenes, and we support the proposed radical pathway with Stern–Volmer quenching,
      trapping experiments and DFT calculations [neese2012orca].
    cites:
    - neese2012orca
- heading: Results and Discussion
  subsections:
  - heading: Reaction development
    paragraphs:
    - text: Irradiation of quinoxalin-2(1H)-one (1) with 4-methylbenzenediazonium tetrafluoroborate in the presence
        of 4CzIPN (2 mol%) in ethanol at 25 °C gave 3a in 94% isolated yield (Scheme 1). Control experiments established
        that the photocatalyst, light and diazonium salt are each essential, and the reaction was completely suppressed
        by TEMPO (Table 1). Replacing ethanol with acetonitrile or water lowered the yield, while running the reaction
        open to air gave 11% of 3a.
    - text: The scope was examined under the optimised conditions (Table 2). Electron-neutral, electron-rich and
        electron-poor aryl groups were all installed, and the yield decreased modestly with the electron deficiency
        of the aryl radical (61–94%). A thiophen-3-yl group was tolerated, showing that heteroaryl diazonium salts
        are competent substrates. No N-arylated product was detected in any case, which we attribute to the mild,
        base-free conditions.
  - heading: Mechanistic studies
    paragraphs:
    - text: Stern–Volmer quenching of 4CzIPN by 1 was linear over the concentration range examined (Figure 1A),
        with a quenching constant of 0.091 mM−1 consistent with reductive quenching of the excited photocatalyst.
        Addition of TEMPO (2.0 equiv.) under otherwise identical conditions shut down product formation (Figure
        1B), supporting a radical pathway. Under air, conversion fell to 27%, consistent with oxygen trapping the
        reduced photocatalyst.
    - text: DFT calculations at the PBE0-D3BJ/def2-TZVP level (SMD, ethanol) place the radical-addition transition
        state at +6.4 kcal mol−1 relative to the separated radical and 1, and the subsequent oxidation at −8.1 kcal
        mol−1 (Figure 2). The computed profile is consistent with a stepwise radical addition/oxidation sequence
        rather than a concerted pathway.
- heading: Conclusion
  paragraphs:
  - text: We have developed a visible-light photoredox C3–H arylation of quinoxalin-2(1H)-ones that proceeds under
      mild, base-free conditions and accommodates electron-poor and heteroaryl diazonium salts. Mechanistic experiments
      and DFT calculations support a reductive-quenching radical pathway. Extending the method to other electron-poor
      heteroarenes and to flow conditions is underway.
