name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[figures,docx,dev]"

      - name: Test suite (offline; live-API tests are opt-in)
        run: python -m pytest -q

      - name: Chemistry self-test
        run: python -m paperforge doctor

      - name: Demo manuscript still scores >= 99 with no errors
        run: |
          python -m paperforge check examples/demo-paper --json > /tmp/demo.json
          python - <<'PY'
          import json

          data = json.load(open("/tmp/demo.json", encoding="utf-8"))
          # `check --json` nests the score object: {"score": {"score": 100.0, "counts": {...}}}
          raw = data["score"]
          result = raw if isinstance(raw, dict) else {"score": raw}
          score = float(result["score"])
          counts = result.get("counts", {})
          print(f"demo score {score} · errors {counts.get('error', '?')} · "
                f"warnings {counts.get('warn', '?')} · notes {counts.get('info', '?')}")
          assert counts.get("error", 0) == 0, f"demo manuscript has errors: {counts}"
          assert score >= 99.0, f"demo manuscript regressed to {score}"
          PY

      - name: Research layer is importable and reports its sources
        run: |
          python -m paperforge research providers
          python -m paperforge institution stats

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check paperforge tests scripts || true   # non-blocking while the baseline is absorbed
      - name: Syntax/compile check (blocking)
        run: python -m compileall -q paperforge tests scripts

  package:
    name: build and install artefacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/paperforge research providers > /dev/null
          /tmp/venv/bin/paperforge institution stats > /dev/null
          /tmp/venv/bin/python -c "import paperforge, paperforge.providers.registry, paperforge.research.store; print(paperforge.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links resolve
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          bad = []
          for md in list(root.glob("*.md")) + list(root.glob("docs/**/*.md")):
              text = md.read_text(encoding="utf-8", errors="replace")
              for target in re.findall(r"\[[^\]]+\]\((?!https?://|#|mailto:)([^)#]+)", text):
                  path = (md.parent / target.split("#")[0])
                  if not path.exists():
                      bad.append(f"{md}: {target}")
          if bad:
              print("broken relative links:")
              print("\n".join(bad))
              sys.exit(1)
          print("all relative documentation links resolve")
          PY
