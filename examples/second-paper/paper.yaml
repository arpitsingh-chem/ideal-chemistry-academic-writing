    at Zenodo (10.5281/zenodo.1111111).
  ai_disclosure: Generative AI tools were used only for language editing; no scientific content, data
    or references were generated by AI.
  safety: Iridium salts are irritants; all handling was performed in a fume hood, and cytotoxicity assays
    followed institutional biosafety protocol IBSC-2025-14.
toc:
  text: One pyrazolate substituent shifts iridium(III) emission across 60 nm, raises the quantum yield
    fourfold and lowers cytotoxicity, separating imaging from therapeutic behaviour.
  image: figures/toc.png
highlights:
- Six [Ir(ppy)2(R-pz)] complexes differ only at the pyrazolate 3-position.
- Emission spans 588-648 nm with quantum yields of 0.22-0.81.
- Electron-donating groups raise brightness and lower cytotoxicity.
