version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      scientific:
        patterns: ["rdkit*", "matplotlib*", "numpy*", "pandas*", "pillow*", "Pillow*"]
      tooling:
        patterns: ["pytest*", "ruff*", "build*", "pypdf*"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
