back_matter:
  coi: The authors declare no competing financial interest.
  funding: This work was supported by the Science and Engineering Research Board (Grant No. CRG/2024/000000).
  acknowledgements: We thank the Central Instrumentation Facility, IISER Bhopal, for NMR and HRMS access.
  data_availability: All data supporting this study are included in the article and its Supporting Information.
    Source data for Figures 1 and 2 are provided in the data/ folder of the submission.
  ai_disclosure: AI tools were used for language editing and reference formatting; all scientific content, data
    and conclusions are the authors' own.
  safety: No unexpected or unusually high hazards were encountered. Aryl diazonium salts were handled in small quantities
    behind a blast shield.
highlights:
  - Eight 3-arylquinoxalin-2(1H)-ones made in 61-94% isolated yield.
  - Chloro, nitro, trifluoromethyl and thienyl groups are tolerated.
  - Stern-Volmer quenching supports reductive photocatalyst turnover.
  - 'Operationally simple: 4CzIPN (2 mol%), blue LEDs, ethanol.'
toc:
  text: A mild visible-light route converts quinoxalin-2(1H)-ones into 3-aryl products in up to 94% yield.
  image: figures/toc.png
narrative:
  general_methods: All reagents were obtained commercially and used as received. NMR spectra were recorded on a
    Bruker Avance 400 MHz spectrometer in DMSO-d6; chemical shifts are reported in ppm relative to TMS. HRMS data
    were acquired on an ESI-TOF instrument. UV–vis spectra were recorded on a Shimadzu UV-2600; emission lifetime
    and quenching measurements used an Edinburgh FS5 spectrofluorometer. DFT calculations were performed with ORCA
    5.0 at the PBE0-D3BJ/def2-TZVP level using the SMD solvation model (ethanol).
  significance: The reaction couples a bench-stable diazonium salt with an unprotected heteroarene under photocatalyst
    control, avoids base and transition-metal additives, and gives complete C3 selectivity. It therefore provides
    a practical entry to a medicinal-chemistry scaffold and a mechanistic framework that should transfer to other
    electron-poor N-heterocycles.
  suggested_reviewers: []
  conclusion: []
options:
  auto_results: true
