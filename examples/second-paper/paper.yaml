paper:
  title: 'Cyclometalated Iridium(III) Pyrazolate Complexes: Substituent Control of Phosphorescence and
    Cytotoxicity'
  journal: Dalton Transactions
  article_type: article
  keywords:
  - iridium(III)
  - phosphorescence
  - pyrazolate
  - cyclometalation
  - cytotoxicity
