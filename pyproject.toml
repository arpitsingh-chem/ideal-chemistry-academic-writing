[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperforge"
version = "2.1.0"
description = "Chemistry-aware manuscript engine: compose, verify, score and package a paper."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY 4.0 (content); code provided for reuse"}
authors = [{name = "Ideal Chemistry Academic Writing contributors"}]
keywords = ["chemistry", "manuscript", "journals", "ACS", "RSC", "Wiley", "peer review"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
figures = ["Pillow>=9", "matplotlib>=3.5"]
docx = ["python-docx>=1.0"]
structures = ["rdkit>=2023.9"]
dev = ["pytest>=7", "pypdf>=3"]

[project.scripts]
paperforge = "paperforge.cli:main"

[tool.setuptools]
packages = ["paperforge"]

[tool.setuptools.package-data]
paperforge = ["../data/*.csv", "../data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: requires internet access (Crossref)"]
